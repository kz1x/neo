<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neo // Local Llama Interface</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #111827;
      --panel-border: #1f2937;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --user-bubble: #1e3a8a;
      --bot-bubble: #1f2937;
      --code-bg: #030712;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 900px;
      height: 100vh;
      border-left: 1px solid var(--panel-border);
      border-right: 1px solid var(--panel-border);
      background: var(--panel);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(17, 24, 39, 0.95);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    select {
      background: #1f2937;
      color: var(--text-main);
      border: 1px solid var(--panel-border);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .repo-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      font-size: 0.82rem;
      color: var(--text-muted);
      border: 1px solid var(--panel-border);
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .repo-link:hover {
      color: #fff;
      border-color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      display: inline-block;
    }

    .status-dot.online {
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
    }

    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--bot-bubble);
      border-bottom-left-radius: 2px;
      border: 1px solid var(--panel-border);
    }

    .message.system-alert {
      align-self: center;
      background: transparent;
      border: 1px dashed var(--panel-border);
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    .input-container {
      padding: 16px 20px;
      border-top: 1px solid var(--panel-border);
      background: var(--panel);
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      background: #030712;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      height: 48px;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="brand">
      <span class="status-dot" id="statusDot"></span>
      <h1>Neo</h1>
    </div>
    <div class="controls">
      <select id="modelSelect">
        <option value="llama3.2">llama3.2</option>
      </select>
      <a class="repo-link" href="https://github.com/kz1x/neo" target="_blank" rel="noopener">Repo</a>
    </div>
  </header>

  <div class="chat-window" id="chatWindow">
    <div class="message assistant">Local Llama interface initialized. Prompts execute directly on your machine's hardware.</div>
  </div>

  <div class="input-container">
    <textarea id="promptInput" placeholder="Send a message..." rows="1"></textarea>
    <button id="sendBtn" onclick="handleSend()">Send</button>
  </div>
</div>

<script>
  const OLLAMA_HOST = "http://localhost:11434";
  const chatWindow = document.getElementById("chatWindow");
  const promptInput = document.getElementById("promptInput");
  const sendBtn = document.getElementById("sendBtn");
  const statusDot = document.getElementById("statusDot");
  const modelSelect = document.getElementById("modelSelect");

  // Multi-turn context memory
  let conversationHistory = [];

  // Check Ollama connection and load locally available models
  async function initOllama() {
    try {
      const res = await fetch(`${OLLAMA_HOST}/api/tags`);
      if (res.ok) {
        const data = await res.json();
        statusDot.classList.add("online");
        if (data.models && data.models.length > 0) {
          modelSelect.innerHTML = "";
          data.models.forEach(m => {
            const opt = document.createElement("option");
            opt.value = m.name;
            opt.textContent = m.name;
            modelSelect.appendChild(opt);
          });
        }
      }
    } catch (err) {
      statusDot.classList.remove("online");
      appendSystemMessage("Cannot connect to local Ollama. Ensure 'ollama serve' is running.");
    }
  }

  initOllama();

  // Enter to send, Shift+Enter for newline
  promptInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  async function handleSend() {
    const text = promptInput.value.trim();
    if (!text) return;

    // Append user query to UI and history
    appendMessage("user", text);
    conversationHistory.push({ role: "user", content: text });
    
    promptInput.value = "";
    promptInput.disabled = true;
    sendBtn.disabled = true;

    // Create placeholder message box for streamed output
    const botMsgDiv = appendMessage("assistant", "");
    const selectedModel = modelSelect.value || "llama3.2";

    try {
      const response = await fetch(`${OLLAMA_HOST}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: selectedModel,
          messages: conversationHistory,
          stream: true
        })
      });

      if (!response.ok) {
        throw new Error(`Ollama returned status ${response.status}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let fullAssistantReply = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const rawChunk = decoder.decode(value, { stream: true });
        const lines = rawChunk.split("\n");

        for (const line of lines) {
          if (line.trim() !== "") {
            const parsed = JSON.parse(line);
            if (parsed.message && parsed.message.content) {
              fullAssistantReply += parsed.message.content;
              botMsgDiv.textContent = fullAssistantReply;
              chatWindow.scrollTop = chatWindow.scrollHeight;
            }
          }
        }
      }

      // Save complete response into context
      conversationHistory.push({ role: "assistant", content: fullAssistantReply });

    } catch (err) {
      botMsgDiv.textContent = "Error communicating with local model. Check console for details.";
      console.error(err);
    } finally {
      promptInput.disabled = false;
      sendBtn.disabled = false;
      promptInput.focus();
    }
  }

  function appendMessage(role, text) {
    const div = document.createElement("div");
    div.className = `message ${role}`;
    div.textContent = text;
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return div;
  }

  function appendSystemMessage(text) {
    const div = document.createElement("div");
    div.className = "message system-alert";
    div.textContent = text;
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }
</script>

</body>
</html>
