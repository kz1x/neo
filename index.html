<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neo // Discord AI Controller</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --border: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --accent: #5865f2; /* Discord blurple */
      --accent-hover: #4752c4;
      --terminal: #030712;
      --green: #22c55e;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .dashboard {
      width: 100%;
      max-width: 950px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .status-badge {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 9999px;
      background: #374151;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
    .online .status-dot { background: var(--green); box-shadow: 0 0 8px rgba(34, 197, 94, 0.6); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card h2 { font-size: 0.95rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

    .terminal-box {
      background: var(--terminal);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    input, textarea, select {
      background: var(--terminal);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
    }

    input:focus, textarea:focus { border-color: var(--accent); }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }

    .repo-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .repo-link:hover { color: #fff; }
  </style>
</head>
<body>

<div class="dashboard">
  <header>
    <div class="brand">
      <h1>Neo Bot Control</h1>
      <div class="status-badge" id="botBadge">
        <span class="status-dot"></span>
        <span id="statusLabel">Offline</span>
      </div>
    </div>
    <a class="repo-link" href="https://github.com/kz1x/neo" target="_blank">Back to Repo</a>
  </header>

  <div class="grid">
    <!-- Active Server Stats -->
    <div class="card">
      <h2>Bot Overview</h2>
      <div id="overviewData" style="font-size: 0.9rem; color: var(--muted);">
        Connecting to local bridge (localhost:5000)...
      </div>
    </div>

    <!-- Live Event Feed -->
    <div class="card">
      <h2>Live Bot Logs</h2>
      <div class="terminal-box" id="logBox">Waiting for bridge connection...</div>
    </div>
  </div>

  <!-- Manual Broadcast -->
  <div class="card">
    <h2>Manual Channel Broadcast</h2>
    <div style="display: flex; gap: 10px;">
      <input type="text" id="targetChannelId" placeholder="Discord Channel ID" style="flex: 1;" />
      <input type="text" id="manualMessage" placeholder="Message content to announce as bot..." style="flex: 2;" />
      <button onclick="sendBroadcast()">Dispatch</button>
    </div>
    <span id="broadcastResult" style="font-size: 0.8rem; color: var(--muted);"></span>
  </div>
</div>

<script>
  const BRIDGE_URL = "http://localhost:5000";

  async function pollStatus() {
    try {
      const res = await fetch(`${BRIDGE_URL}/status`);
      if (res.ok) {
        const data = await res.json();
        
        // Status Badge
        const badge = document.getElementById("botBadge");
        const label = document.getElementById("statusLabel");
        if (data.online) {
          badge.classList.add("online");
          label.textContent = `Online: ${data.bot_user}`;
        } else {
          badge.classList.remove("online");
          label.textContent = "Connecting to Discord...";
        }

        // Overview
        const overview = document.getElementById("overviewData");
        const guildList = data.guilds.map(g => `• ${g.name} (${g.members} members)`).join("<br>");
        overview.innerHTML = `
          <strong>LLM Core:</strong> ${data.model}<br>
          <strong>Active Servers:</strong> ${data.guilds.length}<br>
          <div style="margin-top: 8px;">${guildList || "No guilds detected."}</div>
        `;

        // Logs
        const logBox = document.getElementById("logBox");
        logBox.textContent = data.logs.join("\n") || "No recent activity.";
        logBox.scrollTop = logBox.scrollHeight;
      }
    } catch (e) {
      document.getElementById("botBadge").classList.remove("online");
      document.getElementById("statusLabel").textContent = "Bridge Offline";
      document.getElementById("overviewData").textContent = "Local bridge not detected. Run python bot_bridge.py on your PC.";
    }
  }

  async function sendBroadcast() {
    const channelId = document.getElementById("targetChannelId").value.trim();
    const msg = document.getElementById("manualMessage").value.trim();
    const feedback = document.getElementById("broadcastResult");

    if (!channelId || !msg) {
      feedback.textContent = "Please provide both Channel ID and message.";
      return;
    }

    feedback.textContent = "Sending...";
    try {
      const res = await fetch(`${BRIDGE_URL}/send`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ channel_id: channelId, message: msg })
      });
      const data = await res.json();
      if (res.ok) {
        feedback.textContent = "Message sent successfully!";
        document.getElementById("manualMessage").value = "";
      } else {
        feedback.textContent = `Failed: ${data.error}`;
      }
    } catch (e) {
      feedback.textContent = "Could not communicate with bridge.";
    }
  }

  setInterval(pollStatus, 3000);
  pollStatus();
</script>

</body>
</html>
