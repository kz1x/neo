<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Dashboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      background-color: #f6f8fa;
      color: #24292f;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #d0d7de;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background-color: #2da44e;
      border-radius: 6px;
      text-decoration: none;
    }
    .back-btn:hover {
      background-color: #2c974b;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 16px;
    }
    .card h3 {
      margin-top: 0;
      font-size: 14px;
      color: #57606a;
    }
    .card .metric {
      font-size: 28px;
      font-weight: 700;
      margin: 8px 0 0 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>Project Dashboard</h1>
    <!-- Navigation link back to the repository -->
    <a class="back-btn" href="https://github.com/YOUR-USERNAME/YOUR-REPO-NAME">Back to GitHub Repo</a>
  </header>

  <main class="grid">
    <div class="card">
      <h3>Active Tasks</h3>
      <p class="metric">12</p>
    </div>
    <div class="card">
      <h3>Completion Rate</h3>
      <p class="metric">88%</p>
    </div>
    <div class="card">
      <h3>System Status</h3>
      <p class="metric" style="color: #2da44e;">Operational</p>
    </div>
  </main>

</body>
</html>
